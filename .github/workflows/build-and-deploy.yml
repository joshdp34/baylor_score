name: Render and Deploy Quarto Website

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          cache-version: 1
          packages: |
            any::fs
            any::stringr
            any::glue
            any::tidyverse
            any::fpp3
            any::patchwork
            any::survival
            any::survminer
            any::flextable
            any::parameters
            any::factoextra
            any::NbClust
            any::formatR
            any::ClusterR
            any::mclust
            any::easystats
            any::here
            any::knitr
            any::kableExtra
            any::condformat
            any::formattable
            github::kcuilla/reactablefmtr
            any::scales
            any::plotly
            any::DT
            any::webexercises

      - name: Build generated pages
        run: |
          Rscript build_sport_pages.R
          Rscript build_sidebar_yaml.R

      - name: Render site
        run: quarto render

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
